<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Happy Birthday 💖</title>

    <link rel="stylesheet" href="style.css">

    <div class="container">

                    dalam hidup kamu.
                </p>

                    ~ made with love, for you 🎀💗
                </p>

                <p class="highlight">
                    💌 always wishing you the best
                </p>

            </div>

            <!-- gallery kanan -->
            <div class="gallery-wrapper">

                <div class="gallery">

                    <img src="img/1.jfif" class="photo">
                    <img src="img/2.jfif" class="photo">
                    <img src="img/3.jfif" class="photo">

                    <img src="img/20.jfif" class="photo">
                    <img src="img/21.jfif" class="photo">
                    <img src="img/22.jfif" class="photo">
                    <img src="img/23.jfif" class="photo">
                    <img src="img/13.jfif" class="photo">

                    <!-- ulang biar scroll mulus -->
                    <img src="img/1.jfif" class="photo">
                    <img src="img/2.jfif" class="photo">
                    <img src="img/3.jfif" class="photo">
                    <img src="img/4.jfif" class="photo">

    <!-- confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>

        window.onload = function () {

            // confetti tengah
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 }
            });

            // confetti kiri kanan
            setTimeout(() => {

                confetti({
                    particleCount: 100,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 }
                });

                confetti({
                    particleCount: 100,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 }
                });

            }, 500);

            // play music
            document.getElementById("music").play();

        };

    </script>

    <!-- musik -->
    <audio id="music" loop>
        <source src="music/lagu.mp3" type="audio/mpeg">
    </audio>
